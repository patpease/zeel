<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZEEL — Zoned Energy Estimator for Labs</title>
    <meta
      name="description"
      content="Early-planning energy estimation for laboratory programme mixes. Enter the areas of 21 zone types and see the energy, carbon and cost that programme implies."
    />
    <!--
      The policy lives here rather than only in the Worker so it applies in
      `npm run dev` as well. A policy that exists only in production is a
      policy discovered in production. frame-ancestors is set by the Worker,
      because a meta CSP ignores it and only logs an error.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://zeel.peasestudio.com/" />

    <!--
      Social preview. No og:image: the only artwork here is an SVG, which most
      unfurlers will not render, and pointing at one produces a broken card
      rather than no card. A raster is the open item.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZEEL" />
    <meta property="og:title" content="ZEEL — Zoned Energy Estimator for Labs" />
    <meta property="og:url" content="https://zeel.peasestudio.com/" />
    <meta
      property="og:description"
      content="Enter the areas of 21 laboratory zone types and see the energy use intensity, carbon and cost that mix implies. Runs entirely in your browser."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
