name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm test` type checks first, then runs the suite. The suite includes
      # the golden tests that pin the extraction against figures published on
      # the 2019 poster, so a drift in data/dataset.json fails here.
      #
      # `npm run extract` is deliberately NOT run in CI: the source workbooks
      # are not committed, and the generated dataset is. Regenerating is a local
      # act with the workbooks to hand.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
